name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    name: offline checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies (no engine — smoke_test must still pass)
        run: pip install -r requirements.txt
      - name: Byte-compile everything
        run: python -m compileall -q .
      - name: Run the offline smoke suite
        # This job installs NO engine driver on purpose: CLAUDE.md §6 says
        # every engine script must import cleanly with none of
        # playwright/selenium/pyppeteer present, and this is the job that
        # proves it rather than asserting it.
        run: python3 smoke_test.py
      - name: --help works for every CLI
        run: |
          for engine in playwright_scraper selenium_scraper puppeteer_scraper; do
            python3 "$engine.py" --help > /dev/null
          done
      - name: sample_output.{json,csv} match the Product schema
        # These two files are part of the standard doc set (CLAUDE.md §15)
        # and are written in this repo's documentation stage, after the
        # engines and this suite. Until they land, this step reports a
        # WARNING rather than failing: a check that is red for a reason
        # everyone already knows about teaches people to ignore checks
        # (CLAUDE.md §11). Once the files exist, a schema mismatch is a
        # hard failure, which is what this step is actually for.
        run: |
          if [ ! -f sample_output.json ] || [ ! -f sample_output.csv ]; then
            echo "::warning::sample_output.json/csv are not in the repo yet (CLAUDE.md §15 — added with the doc set). Schema check skipped."
            exit 0
          fi
          python3 -c "
          import csv, json
          from output_writer import PRODUCT_FIELD_NAMES
          rows = json.load(open('sample_output.json'))
          assert rows and set(rows[0]) == set(PRODUCT_FIELD_NAMES)
          with open('sample_output.csv', newline='') as f:
              header = next(csv.reader(f))
          assert header == PRODUCT_FIELD_NAMES
          print('sample_output OK')
          "
      - name: No committed credentials
        run: |
          set +e
          # smoke_test.py deliberately contains fake-credential-SHAPED
          # fixtures to test the masking/redaction logic itself — excluded
          # alongside .env.example, not a loosening of the check against
          # real leaks (the same exclusion the rest of the family applies
          # to its own smoke_test.py).
          MATCHES=$(grep -rnE "(api[_-]?key|TWOCAPTCHA_KEY|G2_PROXY|G2_CDP_ENDPOINT)\s*=\s*['\"][A-Za-z0-9]{10,}" \
            --include="*.py" --include="*.md" --include="*.env*" . | grep -vE "\.env\.example|smoke_test\.py")
          set -e
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::possible committed credential — see matches above"
            exit 1
          fi
          echo "no committed credentials found"

  docker:
    name: docker image builds, runs, and launches Chromium
    runs-on: ubuntu-latest
    # Build the Docker image in CI — nothing else does, and that is exactly
    # how earlier family members shipped a broken one (a COPY list missing
    # a file smoke_test.py needs at build time) without anyone noticing
    # until a user's build failed. Four steps, each catching a distinct way
    # the image can lie about working: it builds at all; its own entrypoint
    # runs (the CMD is --help — the exact invocation a missing module
    # breaks); a real browser actually launches (not just "playwright
    # install --with-deps" exiting 0); and it carries no .env and no test
    # suite — a .env baked into a published image is a credential handed to
    # everyone who can pull it.
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t g2-scraper:ci .
      - name: Entrypoint runs (the CMD a missing module would break)
        run: docker run --rm g2-scraper:ci
      - name: A real browser actually launches inside the image
        run: |
          docker run --rm --entrypoint python3 g2-scraper:ci -c "
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True, args=['--no-sandbox'])
                  page = await browser.new_page()
                  await page.goto('about:blank')
                  await browser.close()
              print('Chromium launched OK')
          asyncio.run(main())
          "
      - name: Image carries no .env and no test suite
        run: |
          BAD=$(docker run --rm --entrypoint sh g2-scraper:ci -c \
            "ls -d .env tests 2>/dev/null; ls *_test.py 2>/dev/null" || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::image contains files it must not ship: see above"
            exit 1
          fi
          echo "image is clean"

  engine-smoke:
    name: engine-smoke (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [playwright, selenium, puppeteer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One venv PER engine, installed from its OWN requirements file
      # (CLAUDE.md §16). A single shared environment resolves the three
      # engines' mutually unsatisfiable pins (pyee, urllib3) by reaching
      # for whatever it can — on a sibling family repo that silently
      # installed a pyppeteer stub instead of the real >=1.0.2 the
      # requirements file asks for, and CI stayed green against a version
      # nobody actually ships.
      - name: Create venv and install requirements-${{ matrix.engine }}.txt
        run: |
          python -m venv .venv-${{ matrix.engine }}
          source .venv-${{ matrix.engine }}/bin/activate
          pip install -r requirements-${{ matrix.engine }}.txt
          pip install pytest
          pip check
      - name: Install browser (Playwright only — Selenium/pyppeteer fetch their own)
        if: matrix.engine == 'playwright'
        run: |
          source .venv-playwright/bin/activate
          playwright install --with-deps chromium
      - name: Run the smoke suite and assert THIS engine did not skip
        run: |
          source .venv-${{ matrix.engine }}/bin/activate
          python3 smoke_test.py
          python3 -c "
          import ${{ matrix.engine }}_scraper as m
          assert getattr(m, {'playwright': 'async_playwright', 'selenium': 'webdriver', 'puppeteer': 'pyppeteer_launch'}['${{ matrix.engine }}']) is not None, \
              '${{ matrix.engine }} did not import — this job installed it and must not report absent'
          print('${{ matrix.engine }} engine import OK')
          "
