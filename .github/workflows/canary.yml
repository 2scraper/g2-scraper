name: canary

on:
  schedule:
    - cron: "17 7 * * *"   # once daily; avoid :00 so it doesn't pile up with everyone else's
  workflow_dispatch: {}     # dispatch manually at least once before trusting the badge

jobs:
  # A real local-first browser run against a real g2.com category.
  #
  # A bare GitHub runner is consistently blocked by DataDome, so this job
  # skips unless G2_PROXY is configured. Once configured it is strict: only
  # EXIT_OK plus a complete three-page result passes. Treating blocked,
  # empty, or partial as green would hide exactly the parser/pagination
  # regressions a live canary exists to detect.
  #
  # ALSO NOTE, and do not "fix" this into a sibling repo's threshold:
  # price_confirmed_pct is expected to be 0 (or null) here. g2.com carries
  # NO price on a category card or a product page at all — pricing lives on
  # a separate /pricing page behind --with-pricing, which this canary
  # deliberately does not use (one extra request per product, against a
  # best-effort text parser). Asserting a price floor the way lidl-scraper's
  # or shein-scraper's canaries do would fail on a perfectly good run.
  canary-live:
    runs-on: ubuntu-latest
    env:
      HAS_PROXY: ${{ secrets.G2_PROXY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip — no G2_PROXY secret configured
        if: env.HAS_PROXY != 'true'
        run: |
          echo "::notice::Skipping the live pagination canary: no G2_PROXY secret is set. \
          A bare datacentre runner is consistently blocked by G2/DataDome, so treating that \
          result as a passing canary would hide parser and pagination regressions."

      - uses: actions/setup-python@v5
        if: env.HAS_PROXY == 'true'
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium
        if: env.HAS_PROXY == 'true'

      - name: Run three real category pages through the configured proxy
        if: env.HAS_PROXY == 'true'
        env:
          G2_PROXY: ${{ secrets.G2_PROXY }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          set +e
          python3 playwright_scraper.py \
            --category crm --max-pages 3 --max-results 60 \
            --format json --out canary_out.json --dump-html
          echo "exit_code=$?" >> "$GITHUB_ENV"

      - name: Require a complete multi-page run
        if: env.HAS_PROXY == 'true'
        run: |
          python3 -c "
          import json, os, sys

          code = int(os.environ['exit_code'])
          print(f'playwright_scraper.py exited {code}')
          if code != 0:
              print(f'::error::live canary must complete; exit {code} means blocked, empty, partial, or broken')
              sys.exit(1)
          meta = json.load(open('canary_out.json.meta.json'))
          print(json.dumps(meta, indent=2))
          assert meta['status'] == 'complete', meta
          assert meta['pages_completed'] >= 3, meta
          assert meta['product_count'] >= 20, meta
          print(f\"canary: got {meta['product_count']} products in {meta['pages_completed']} pages\")
          "

      - name: Upload artifacts (output + debug HTML) on every run
        if: always() && env.HAS_PROXY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-live-${{ github.run_id }}
          path: |
            canary_out.json
            canary_out.json.meta.json
            canary_out_debug.html
          retention-days: 14

  # Opt-in, mirroring the rest of the family's pattern: exercises the
  # --cdp-endpoint (2Captcha Scraping Browser API) path when a repo secret
  # is configured. Skips cleanly — not red — when it isn't (CLAUDE.md §11:
  # a canary behind an optional secret is always a SKIP, never a hard
  # failure). This is also the single most useful observation this repo can
  # make about g2.com that it has not made yet: whether the Scraping
  # Browser API's own device identity and exit get past DataDome where a
  # bare CI runner does not. Nothing here solves DataDome — the question is
  # whether it fires at all.
  canary-cdp:
    runs-on: ubuntu-latest
    env:
      HAS_CDP: ${{ secrets.G2_CDP_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip — no G2_CDP_ENDPOINT secret configured
        if: env.HAS_CDP != 'true'
        run: |
          echo "::notice::Skipping the Scraping Browser API run: no G2_CDP_ENDPOINT \
          secret is set. This is optional — canary-live above covers the local browser path \
          when G2_PROXY is configured. Set G2_CDP_ENDPOINT (and TWOCAPTCHA_KEY) \
          as repo secrets to also turn this job on. This is a SKIP, not a pass or a fail."

      - uses: actions/setup-python@v5
        if: env.HAS_CDP == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements-playwright.txt
        if: env.HAS_CDP == 'true'

      # Both secrets go through the ENVIRONMENT, never a command-line flag
      # (CLAUDE.md §3: credentials never reach argv). env_config.py already
      # reads G2_CDP_ENDPOINT/TWOCAPTCHA_KEY unconditionally, so this is
      # correct with or without either secret set.
      - name: Run over the Scraping Browser API
        if: env.HAS_CDP == 'true'
        env:
          G2_CDP_ENDPOINT: ${{ secrets.G2_CDP_ENDPOINT }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          set +e
          python3 playwright_scraper.py \
            --category crm --max-pages 3 --max-results 60 \
            --format json --out canary_cdp_out.json --dump-html
          echo "cdp_exit_code=$?" >> "$GITHUB_ENV"

      - name: Require a complete multi-page managed-browser run
        if: env.HAS_CDP == 'true'
        run: |
          python3 -c "
          import json, os, sys
          code = int(os.environ['cdp_exit_code'])
          print(f'playwright_scraper.py (--cdp-endpoint) exited {code}')
          if code != 0:
              print(f'::error::managed-browser canary must complete; got exit {code}')
              sys.exit(1)
          meta = json.load(open('canary_cdp_out.json.meta.json'))
          assert meta['status'] == 'complete', meta
          assert meta['pages_completed'] >= 3, meta
          assert meta['product_count'] >= 20, meta
          "

      - name: Upload artifacts on every non-skipped run
        if: always() && env.HAS_CDP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-cdp-${{ github.run_id }}
          path: |
            canary_cdp_out.json
            canary_cdp_out.json.meta.json
            canary_cdp_out_debug.html
          retention-days: 14
